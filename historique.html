<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Historique des séances</title>
  <style>
    body {
      font-family: "IBM Plex Sans", sans-serif;
      background-color: #f7f7f7;
      margin: 0;
      padding: 2rem;
      color: #222;
    }
    h1 {
      font-size: 2rem;
      margin-bottom: 1rem;
    }
    .seance-card {
      background: white;
      border-radius: 1rem;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.05);
      padding: 1.5rem;
      margin-bottom: 1.5rem;
    }
    .seance-card h2 {
      margin-top: 0;
      font-size: 1.2rem;
      margin-bottom: 0.5rem;
    }
    .seance-card p {
      margin: 0.3rem 0;
      font-size: 0.95rem;
      color: #444;
    }
    .block-type {
      display: inline-block;
      background-color: #eee;
      color: #333;
      padding: 0.2rem 0.5rem;
      border-radius: 0.5rem;
      font-size: 0.8rem;
      margin: 0.1rem;
    }
    .card-buttons {
      margin-top: 1rem;
      display: flex;
      gap: 1rem;
    }
    button {
      font-family: inherit;
      background: #222;
      color: white;
      border: none;
      border-radius: 0.5rem;
      padding: 0.5rem 1rem;
      cursor: pointer;
      transition: background 0.2s ease;
    }
    button:hover {
      background: #444;
    }
    .empty {
      font-style: italic;
      color: #777;
    }
  </style>
</head>
<body>
  <h1>Historique des séances</h1>
  <div id="historiqueContainer"></div>

  <script>
    const container = document.getElementById("historiqueContainer");

    let historique = [];
    try {
      historique = JSON.parse(localStorage.getItem("historiqueSeances")) || [];
    } catch (e) {
      console.error("Erreur de lecture de l’historique :", e);
    }

    if (historique.length === 0) {
      container.innerHTML = '<p class="empty">Aucune séance enregistrée pour le moment.</p>';
    } else {
      historique.reverse().forEach((entry, index) => {
        const card = document.createElement("div");
        card.className = "seance-card";

        const date = new Date(entry.timestamp);
        const formatted = date.toLocaleString("fr-FR", {
          weekday: "long",
          year: "numeric",
          month: "long",
          day: "numeric",
          hour: "2-digit",
          minute: "2-digit"
        });

        card.innerHTML += `<h2>Séance du ${formatted}</h2>`;

        const types = [...new Set(entry.session.map(b => b.type))].map(t => `<span class="block-type">${t}</span>`).join(" ");
        card.innerHTML += `<p><strong>Types :</strong> ${types}</p>`;

        const titres = entry.session
          .filter(b => b.titre)
          .map(b => b.titre)
          .slice(0, 3)
          .join(" • ");
        if (titres) {
          card.innerHTML += `<p><strong>Titres :</strong> ${titres}${entry.session.length > 3 ? "…" : ""}</p>`;
        }

        const totalDuration = entry.session.reduce((acc, b) => acc + (parseInt(b.duree || b.duration || 0)), 0);
        card.innerHTML += `<p><strong>Durée totale :</strong> ${totalDuration} min</p>`;

        const btnGroup = document.createElement("div");
        btnGroup.className = "card-buttons";

        const previewBtn = document.createElement("button");
        previewBtn.textContent = "Prévisualiser";
        previewBtn.onclick = () => {
          localStorage.setItem("seance", JSON.stringify(entry.session));
          window.location.href = "preview.html";
        };

        const lectureBtn = document.createElement("button");
        lectureBtn.textContent = "Démarrer";
        lectureBtn.onclick = () => {
          localStorage.setItem("seance", JSON.stringify(entry.session));
          window.location.href = "lecture.html";
        };

        btnGroup.appendChild(previewBtn);
        btnGroup.appendChild(lectureBtn);
        card.appendChild(btnGroup);

        container.appendChild(card);
      });
    }
  </script>
</body>
</html>
