<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Historique des séances</title>
  <style>
    body {
      font-family: "IBM Plex Sans", sans-serif;
      background-color: #f5f5f5;
      margin: 0;
      padding: 2rem;
      color: #222;
    }
    h1 {
      font-size: 2.2rem;
      margin-bottom: 1rem;
    }
    .session-container {
      margin-bottom: 3rem;
      padding: 1rem;
      background: #fff;
      border-radius: 1rem;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }
    .session-header {
      font-size: 1.4rem;
      font-weight: bold;
      margin-bottom: 1rem;
    }
    .card-row {
      display: flex;
      gap: 1rem;
      overflow-x: auto;
      padding-bottom: 1rem;
    }
    .card {
      flex: 0 0 auto;
      width: 280px;
      background: #fafafa;
      border-radius: 0.75rem;
      box-shadow: 0 1px 4px rgba(0,0,0,0.1);
      padding: 1rem;
    }
    .card h3 {
      font-size: 1rem;
      margin-bottom: 0.5rem;
    }
    .card .pdf-preview {
      width: 100%;
      height: 150px;
      object-fit: contain;
      background: #ddd;
      margin-bottom: 0.5rem;
    }
    .card .info {
      font-size: 0.9rem;
      line-height: 1.3;
    }
  </style>
</head>
<body>
  <h1>Historique des séances</h1>
  <div id="history"></div>

  <script>
    function formatDateTime(timestamp) {
      const date = new Date(timestamp);
      return `Séance du ${date.toLocaleDateString('fr-FR')} à ${date.getHours().toString().padStart(2, '0')}:${date.getMinutes().toString().padStart(2, '0')}`;
    }

    const history = JSON.parse(localStorage.getItem('historiqueSeances')) || [];
    const container = document.getElementById('history');

    history.forEach((session, index) => {
      const sessionDiv = document.createElement('div');
      sessionDiv.className = 'session-container';

      const header = document.createElement('div');
      header.className = 'session-header';
      header.textContent = formatDateTime(session.date);
      sessionDiv.appendChild(header);

      const row = document.createElement('div');
      row.className = 'card-row';

      session.blocs.forEach(bloc => {
        const card = document.createElement('div');
        card.className = 'card';

        const title = document.createElement('h3');
        title.textContent = bloc.type;
        card.appendChild(title);

        if (bloc.pdf && bloc.pdf !== "") {
          const img = document.createElement('img');
          img.src = `./pdf/${bloc.pdf.replace('.pdf', '.png')}`;
          img.alt = bloc.titre;
          img.className = 'pdf-preview';
          card.appendChild(img);
        }

        const info = document.createElement('div');
        info.className = 'info';
        info.innerHTML = `
          <strong>${bloc.titre}</strong><br/>
          ${bloc.auteur || ''}<br/>
          ${bloc.recueil || ''}<br/>
          ${bloc.date || ''}<br/><br/>
          ${bloc.objectifs || ''}
        `;
        card.appendChild(info);

        row.appendChild(card);
      });

      sessionDiv.appendChild(row);
      container.appendChild(sessionDiv);
    });
  </script>
</body>
</html>
