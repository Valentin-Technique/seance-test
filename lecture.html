
<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Lecture de séance</title>
  <style>
    body { margin: 0; font-family: sans-serif; background-color: #111; color: #fff; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; }
    #contenu, #pause { display: none; flex-direction: column; align-items: center; text-align: center; }
    iframe { width: 90vw; height: 80vh; border: none; margin-top: 1rem; }
    #timer, #message { font-size: 2rem; margin: 1rem; }
    button { font-size: 1.2rem; padding: 0.5rem 1rem; margin-top: 1rem; }
  </style>
</head>
<body>
  <div id="contenu">
    <h1 id="titre">Titre</h1>
    <div id="timer">00:00</div>
    <iframe id="pdf"></iframe>
    <button onclick="suivant()">⏭ Passer au suivant</button>
  </div>

  <div id="pause">
    <h2>⏸ Pause</h2>
    <div id="message">Message ici</div>
    <div id="pause-timer">00:00</div>
    <button onclick="suivant()">▶️ Continuer</button>
  </div>

<script>
const messages = [
  "Respire profondément, détends ton bras droit.",
  "Savais-tu que Popper détestait jouer ses propres études en concert ?",
  "Le trille du 18e siècle était souvent plus court et discret.",
  "Pense à ton centre de gravité en haut de la touche.",
  "Les musiciens baroques répétaient rarement à pleine voix."
];

const seance = JSON.parse(localStorage.getItem("seance") || "[]");

let index = 0;
let timerInterval = null;
let pauseInterval = null;
let messageInterval = null;

function afficherBloc(bloc) {
  document.getElementById("contenu").style.display = "flex";
  document.getElementById("pause").style.display = "none";
  document.getElementById("titre").innerText = bloc.titre;
  document.getElementById("pdf").src = bloc.pdf;

  let duree = Math.floor(bloc.duree * 60);
  majTimer("timer", duree);
  clearInterval(timerInterval);
  timerInterval = setInterval(() => {
    duree--;
    majTimer("timer", duree);
    if (duree <= 0) {
      clearInterval(timerInterval);
      if (bloc.pause > 0) {
        afficherPause(bloc.pause);
      } else {
        suivant();
      }
    }
  }, 1000);
}

function afficherPause(pauseMinutes) {
  document.getElementById("contenu").style.display = "none";
  document.getElementById("pause").style.display = "flex";

  let pauseSeconds = Math.floor(pauseMinutes * 60);
  changerMessage();
  clearInterval(pauseInterval);
  clearInterval(messageInterval);
  pauseInterval = setInterval(() => {
    pauseSeconds--;
    majTimer("pause-timer", pauseSeconds);
    if (pauseSeconds <= 0) {
      clearInterval(pauseInterval);
      clearInterval(messageInterval);
      suivant();
    }
  }, 1000);
  messageInterval = setInterval(changerMessage, 8000);
}

function changerMessage() {
  const message = messages[Math.floor(Math.random() * messages.length)];
  document.getElementById("message").innerText = message;
}

function majTimer(id, secondes) {
  const m = Math.floor(secondes / 60).toString().padStart(2, '0');
  const s = (secondes % 60).toString().padStart(2, '0');
  document.getElementById(id).innerText = `${m}:${s}`;
}

function suivant() {
  if (index >= seance.length) {
    alert("🎉 Séance terminée !");
    return;
  }
  afficherBloc(seance[index]);
  index++;
}

suivant(); // démarrage
</script>
</body>
</html>
