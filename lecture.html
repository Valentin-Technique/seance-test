
<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <title>Lecture de séance</title>
  <style>
    html, body { margin: 0; padding: 0; overflow: hidden; background: #000; }
    #pdf-viewer { width: 100vw; height: 100vh; }
    canvas { display: block; margin: auto; background: #333; }
    #message { position: absolute; top: 20px; left: 20px; color: white; font-size: 1.2em; }
  </style>
</head>
<body>
<div id="pdf-viewer"><canvas id="pdf-canvas"></canvas></div>
<div id="message"></div>

<script src="pdfjs/pdf.js"></script>
<script>
document.addEventListener("DOMContentLoaded", () => {
  const url = "popper_6.pdf"; // Fichier PDF exemple
  const canvas = document.getElementById("pdf-canvas");
  const ctx = canvas.getContext("2d");

  if (document.documentElement.requestFullscreen) {
    document.documentElement.requestFullscreen();
  }

  const showMessage = (msg) => {
    document.getElementById("message").innerText = msg;
  };

  pdfjsLib.GlobalWorkerOptions.workerSrc = 'pdfjs/pdf.worker.js';

  const renderPDF = async () => {
    const pdf = await pdfjsLib.getDocument(url).promise;
    const page = await pdf.getPage(1);
    const viewport = page.getViewport({ scale: 1.5 });

    canvas.height = viewport.height;
    canvas.width = viewport.width;

    const renderContext = {
      canvasContext: ctx,
      viewport: viewport
    };
    await page.render(renderContext).promise;
  };

  renderPDF();
  showMessage("Début du bloc...");

  setTimeout(() => {
    showMessage("Pause ! 🎻 Astuce : relâchez vos épaules.");
  }, 15000); // simulate 15s de bloc avant pause

});
</script>
</body>
</html>
