<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#000000">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="apple-touch-icon" href="icone-192.png">
  <title>Lecture de séance</title>

  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans&display=swap" rel="stylesheet">

  <style>
    html, body {
      margin: 0;
      padding: env(safe-area-inset);
      background: black;
      color: white;
      height: 100%;
      width: 100%;
      font-family: 'IBM Plex Sans', sans-serif;
      overflow: hidden;
      -webkit-overflow-scrolling: touch;
    }

    #pdf-container {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      overflow: scroll;
      z-index: 1;
      -webkit-overflow-scrolling: touch;
      touch-action: auto;
    }

    #pdf-container canvas {
      display: block;
      margin: auto;
      max-width: none;
      max-height: none;
      transform-origin: center center;
    }

    #pdf-container.sonsf {
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
    }

    #timer {
      position: fixed;
      top: 10px;
      left: 10px;
      background: rgba(50, 50, 50, 0.85);
      color: white;
      padding: 20px 30px;
      border-radius: 10px;
      z-index: 30;
      font-size: 28px;
      text-align: center;
    }

    #pause-message-container {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      z-index: 5;
    }

    #pause-message {
      font-size: 2em;
      padding: 1rem;
    }

    #nav-bar, #control-bar {
      position: fixed;
      z-index: 25;
      display: flex;
      gap: 10px;
      background: rgba(40, 40, 40, 0.9);
      border-radius: 8px;
      padding: 10px;
    }

    #nav-bar {
      bottom: 30px;
      right: 20px;
    }

    #control-bar {
      top: env(safe-area-inset-top, 30px);
      right: 20px;
    }

    #nav-bar button,
    #control-bar button {
      padding: 14px 20px;
      font-size: 18px;
      cursor: pointer;
      background-color: #222;
      color: white;
      border: 1px solid #555;
      border-radius: 6px;
      font-family: 'IBM Plex Sans', sans-serif;
    }

    @media (hover: hover) {
      #nav-bar button:hover,
      #control-bar button:hover {
        background-color: #555;
        transform: scale(1.05);
      }
    }
  </style>
</head>
<body>
  <div id="timer"></div>
  <div id="control-bar">
    <button onclick="endSession()">Terminer la séance</button>
    <button onclick="prevSegment()">Segment précédent</button>
    <button onclick="skipSegment()">Segment suivant</button>
  </div>
  <div id="pdf-container"></div>
  <div id="nav-bar">
    <button onclick="changePage(-1)">⟵</button>
    <button onclick="zoomOut()">➖</button>
    <button onclick="zoomIn()">➕</button>
    <button onclick="changePage(1)">⟶</button>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <script>
    pdfjsLib.GlobalWorkerOptions.workerSrc = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";

    const container = document.getElementById("pdf-container");
    const timerEl = document.getElementById("timer");
    const rawSession = JSON.parse(localStorage.getItem("seance") || "[]");
    const blocs = [];

    for (let i = 0; i < rawSession.length; i++) {
      const current = rawSession[i];
      const next = rawSession[i + 1];
      blocs.push(current);
      const isWork = current.type !== "pause" && current.type !== "sons-filés";
      const nextIsWork = next && next.type !== "pause" && next.type !== "sons-filés";
      if (isWork && nextIsWork) blocs.push({ type: "pause", duree: 2 });
    }

    let current = 0;
    let pdfDoc = null;
    let pageNum = 1;
    let scale = 1.2;
    let canvas = null;

    let timerInterval;

    const messages = [
      "Pense à relâcher les épaules.",
      "Souffle. Respire avec ton geste.",
      "Moins de pression, plus d'élan.",
      "La précision vient avec la lenteur.",
      "Un bon trille est un trille détendu.",
      "Ne serre pas l’archet avec le pouce.",
      "Joue pour écouter, pas pour produire.",
      "Le vibrato n’est pas un sauvetage."
    ];

    function showPause(duration) {
      container.innerHTML = '<div id="pause-message-container"><div id="pause-message"></div></div>';
      const msg = document.getElementById("pause-message");
      function rotate() {
        msg.textContent = messages[Math.floor(Math.random() * messages.length)];
      }
      rotate();
      startTimer(duration, () => {
        clearInterval(timerInterval);
        current++;
        loadNext();
      });
      setInterval(rotate, 10000);
    }

    function startTimer(duration, callback) {
      clearInterval(timerInterval);
      let t = duration;
      timerEl.textContent = formatTime(t);
      timerInterval = setInterval(() => {
        t--;
        timerEl.textContent = formatTime(t);
        if (t <= 0) {
          clearInterval(timerInterval);
          callback();
        }
      }, 1000);
    }

    function formatTime(s) {
      const m = Math.floor(s / 60);
      const sec = s % 60;
      return `${m}:${sec.toString().padStart(2, '0')}`;
    }

    function renderPage(pdf, num) {
      pdf.getPage(num).then(page => {
        const viewport = page.getViewport({ scale });
        canvas = document.createElement("canvas");
        const ctx = canvas.getContext("2d");
        canvas.height = viewport.height;
        canvas.width = viewport.width;
        container.innerHTML = "";
        container.appendChild(canvas);
        page.render({ canvasContext: ctx, viewport });
      });
    }

    function changePage(offset) {
      if (!pdfDoc) return;
      const newPage = pageNum + offset;
      if (newPage >= 1 && newPage <= pdfDoc.numPages) {
        pageNum = newPage;
        renderPage(pdfDoc, pageNum);
      }
    }

    function zoomIn() {
      scale *= 1.25;
      renderPage(pdfDoc, pageNum);
    }

    function zoomOut() {
      scale = Math.max(0.5, scale / 1.25);
      renderPage(pdfDoc, pageNum);
    }

    function endSession() {
      clearInterval(timerInterval);
      window.location.href = "index.html";
    }

    function skipSegment() {
      clearInterval(timerInterval);
      current++;
      loadNext();
    }

    function prevSegment() {
      clearInterval(timerInterval);
      if (current > 0) current--;
      loadNext();
    }

    function loadNext() {
      if (current >= blocs.length) return endSession();
      const bloc = blocs[current];
      const type = bloc.type.trim().toLowerCase().replace(/\s+/g, "-");

      if (type === "pause") {
        document.getElementById("nav-bar").style.display = "none";
        showPause((bloc.duree || 2) * 60);
        return;
      }

      if (type === "sons-filés") {
        document.getElementById("nav-bar").style.display = "none";
        container.className = "sonsf";
        container.innerHTML = `<div style="width:100vw; height:100vh; display:flex; flex-direction:column; justify-content:center; align-items:center;">
          <div id="sons-timer" style="font-size:10rem;">10:00</div>
        </div>`;
        let t = 10 * 60;
        const timerDisplay = document.getElementById("sons-timer");
        timerInterval = setInterval(() => {
          t--;
          const min = Math.floor(t / 60).toString().padStart(2, "0");
          const sec = (t % 60).toString().padStart(2, "0");
          timerDisplay.textContent = `${min}:${sec}`;
          if (t <= 0) {
            clearInterval(timerInterval);
            current++;
            loadNext();
          }
        }, 1000);
        return;
      }

      container.className = "";
      document.getElementById("nav-bar").style.display = "flex";
      pdfjsLib.getDocument(bloc.pdf).promise.then(pdf => {
        pdfDoc = pdf;
        pageNum = 1;
        renderPage(pdf, pageNum);
        startTimer((bloc.duree || 10) * 60, () => {
          current++;
          loadNext();
        });
      });
    }

    // Tap navigation
    document.addEventListener("touchend", e => {
      if (!pdfDoc || !canvas) return;
      const x = e.changedTouches[0].clientX;
      const width = window.innerWidth;
      if (x < width * 0.3) changePage(-1);
      else if (x > width * 0.7) changePage(1);
    });

    document.addEventListener("DOMContentLoaded", () => {
      document.body.requestFullscreen?.().catch(() => {});
      loadNext();
    });
  </script>

  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function () {
        navigator.serviceWorker.register('/seance-test/service-worker.js')
          .catch(function (error) {
            console.error('Service Worker registration failed:', error);
          });
      });
    }
  </script>
</body>
</html>
