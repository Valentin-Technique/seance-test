<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Lecture de séance</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      background: black;
      color: white;
      overflow: hidden;
      height: 100%;
    }
    #pdf-container {
      position: absolute;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: 1;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    canvas {
      display: block;
      margin: auto;
      max-width: 100%;
      height: auto;
    }
    #timer {
      position: fixed;
      top: 10px;
      left: 10px;
      background: rgba(255,255,255,0.2);
      color: white;
      padding: 10px;
      border-radius: 5px;
      z-index: 10;
      cursor: grab;
    }
    #pause-message {
      font-size: 2em;
      text-align: center;
      padding-top: 40vh;
      z-index: 5;
      position: relative;
    }
    #nav-bar {
      position: fixed;
      bottom: 10px;
      right: 10px;
      background: rgba(255, 255, 255, 0.2);
      padding: 10px;
      border-radius: 8px;
      z-index: 15;
    }
    #nav-bar button {
      margin: 0 5px;
      padding: 5px 10px;
      font-size: 16px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div id="timer"></div>
  <div id="pdf-container"></div>
  <div id="nav-bar">
    <button onclick="changePage(-1)">⟵</button>
    <button onclick="zoomOut()">➖</button>
    <button onclick="zoomIn()">➕</button>
    <button onclick="changePage(1)">⟶</button>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <script>
    pdfjsLib.GlobalWorkerOptions.workerSrc = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";

    const blocs = JSON.parse(localStorage.getItem("seance") || "[]");
    const container = document.getElementById('pdf-container');
    const timerEl = document.getElementById('timer');

    let current = 0;
    let pdfDoc = null;
    let pageNum = 1;
    let scale = 1.5;
    let timerInterval;
    let dragOffset = {x:0, y:0};
    let isDragging = false;

    const messages = [
      "Pense à relâcher les épaules.",
      "Souffle. Respire avec ton geste.",
      "Moins de pression, plus d'élan.",
      "La précision vient avec la lenteur.",
      "Un bon trille est un trille détendu.",
      "Ne serre pas l’archet avec le pouce.",
      "Joue pour écouter, pas pour produire.",
      "Le vibrato n’est pas un sauvetage."
    ];

    function showPause(duration) {
      container.innerHTML = '<div id="pause-message"></div>';
      const msgDiv = document.getElementById('pause-message');
      let elapsed = 0;
      function rotateMessage() {
        msgDiv.textContent = messages[Math.floor(Math.random() * messages.length)];
      }
      rotateMessage();
      const pauseInt = setInterval(() => {
        elapsed += 10;
        rotateMessage();
        if (elapsed >= duration * 1000) {
          clearInterval(pauseInt);
          current++;
          loadNext();
        }
      }, 10000);
    }

    function startTimer(duration, callback) {
      let remaining = duration;
      timerEl.textContent = formatTime(remaining);
      timerInterval = setInterval(() => {
        remaining--;
        timerEl.textContent = formatTime(remaining);
        if (remaining <= 0) {
          clearInterval(timerInterval);
          callback();
        }
      }, 1000);
    }

    function formatTime(s) {
      const min = Math.floor(s / 60);
      const sec = s % 60;
      return min + ":" + (sec < 10 ? "0" : "") + sec;
    }

    function renderPage(pdf, num) {
      pdf.getPage(num).then(page => {
        const viewport = page.getViewport({ scale });
        const canvas = document.createElement("canvas");
        const ctx = canvas.getContext('2d');
        canvas.height = viewport.height;
        canvas.width = viewport.width;
        container.innerHTML = '';
        container.appendChild(canvas);
        const renderContext = { canvasContext: ctx, viewport: viewport };
        page.render(renderContext);
      });
    }

    function changePage(offset) {
      if (!pdfDoc) return;
      const newPage = pageNum + offset;
      if (newPage >= 1 && newPage <= pdfDoc.numPages) {
        pageNum = newPage;
        renderPage(pdfDoc, pageNum);
      }
    }

    function zoomIn() {
      scale += 0.25;
      renderPage(pdfDoc, pageNum);
    }

    function zoomOut() {
      scale = Math.max(0.5, scale - 0.25);
      renderPage(pdfDoc, pageNum);
    }

    function loadNext() {
      if (current >= blocs.length) {
        window.location.href = "index.html";
        return;
      }

      const bloc = blocs[current];
      if (bloc.type === "pause") {
        showPause(bloc.duree * 60);
        return;
      }

      pdfjsLib.getDocument(bloc.pdf).promise.then(pdf => {
        pdfDoc = pdf;
        pageNum = 1;
        renderPage(pdfDoc, pageNum);
        startTimer(bloc.duree * 60, () => {
          current++;
          if (current < blocs.length) {
            blocs.splice(current, 0, { type: "pause", duree: 2 });
          }
          loadNext();
        });
      });
    }

    timerEl.addEventListener("mousedown", e => {
      isDragging = true;
      dragOffset.x = e.clientX - timerEl.offsetLeft;
      dragOffset.y = e.clientY - timerEl.offsetTop;
    });
    document.addEventListener("mousemove", e => {
      if (isDragging) {
        timerEl.style.left = (e.clientX - dragOffset.x) + "px";
        timerEl.style.top = (e.clientY - dragOffset.y) + "px";
      }
    });
    document.addEventListener("mouseup", () => isDragging = false);

    document.addEventListener("keydown", e => {
      if (e.key === "ArrowRight") changePage(1);
      if (e.key === "ArrowLeft") changePage(-1);
    });

    document.addEventListener("DOMContentLoaded", () => {
      document.body.requestFullscreen?.().catch(() => {});
      loadNext();
    });
  </script>
</body>
</html>
