<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Générateur de séance</title>
  <style>
    body {
      font-family: "IBM Plex Sans", sans-serif;
      margin: 2rem;
      background-color: #f9f9f9;
      color: #222;
    }
    h1 {
      font-size: 2rem;
    }
    fieldset {
      border: 1px solid #ccc;
      padding: 1rem;
      margin-bottom: 1.5rem;
    }
    legend {
      font-weight: bold;
    }
    label {
      display: inline-block;
      margin-right: 1rem;
    }
    button {
      font-size: 1rem;
      padding: 0.5rem 1rem;
      background: #222;
      color: white;
      border: none;
      border-radius: 0.5rem;
      cursor: pointer;
    }
    button:hover {
      background: #444;
    }
  </style>
</head>
<body>
  <h1>Générateur de séance technique</h1>

  <form id="sessionForm">
    <fieldset id="instrumentField">
      <legend>Instrument</legend>
      <!-- Dynamique -->
    </fieldset>

    <fieldset id="epoqueField">
      <legend>Époque</legend>
      <!-- Dynamique -->
    </fieldset>

    <fieldset id="objectifsField">
      <legend>Objectifs</legend>
      <!-- Dynamique -->
    </fieldset>

    <label for="duree">Durée de la séance :</label>
    <select id="duree">
      <option value="20">20 min</option>
      <option value="25">25 min</option>
      <option value="30">30 min</option>
      <option value="35">35 min</option>
      <option value="40">40 min</option>
      <option value="45">45 min</option>
      <option value="50">50 min</option>
      <option value="60">60 min</option>
      <option value="90">90 min</option>
      <option value="120">120 min</option>
      <option value="180">180 min</option>
    </select>

    <br><br>
    <label><input type="checkbox" id="sonsFiles" /> Inclure sons filés (10 min supplémentaires)</label>

    <br><br>
    <button type="submit">Générer la séance</button>
  </form>

  <script>
    const API_URL = "https://script.google.com/macros/s/AKfycbzC5QT7l5KOLK31aabStx_lKwL9FW7lMqPYpvdSzxSAJohoDl1Zi1TI2ocT29GdOE-cLQ/exec";

    let allData = [];

    // Récupérer les données de la base
    fetch(API_URL)
      .then(res => res.json())
      .then(data => {
        allData = data;

        // Extraire les valeurs uniques pour les filtres
        const instruments = [...new Set(data.map(e => e.instrument.trim()).filter(Boolean))];
        const epoques = [...new Set(data.map(e => e.époque.trim()).filter(Boolean))];

        // Objectifs : éclater les valeurs séparées par virgule
        const objectifs = [...new Set(data.flatMap(e => e.objectifs.split(",").map(o => o.trim())).filter(Boolean))];

        populateCheckboxes("instrumentField", instruments, "instrument");
        populateCheckboxes("epoqueField", epoques, "epoque");
        populateCheckboxes("objectifsField", objectifs, "objectif");
      });

    function populateCheckboxes(fieldId, values, namePrefix) {
      const field = document.getElementById(fieldId);
      values.forEach(val => {
        const label = document.createElement("label");
        const input = document.createElement("input");
        input.type = "checkbox";
        input.name = namePrefix;
        input.value = val;
        label.appendChild(input);
        label.append(" " + val);
        field.appendChild(label);
      });
    }

    // Générer la séance
    document.getElementById("sessionForm").addEventListener("submit", e => {
      e.preventDefault();

      const selectedInstruments = [...document.querySelectorAll("input[name=instrument]:checked")].map(i => i.value);
      const selectedEpoques = [...document.querySelectorAll("input[name=epoque]:checked")].map(i => i.value);
      const selectedObjectifs = [...document.querySelectorAll("input[name=objectif]:checked")].map(i => i.value);
      const dureeTotale = parseInt(document.getElementById("duree").value);
      const includeSonsFiles = document.getElementById("sonsFiles").checked;

      // Filtrer les exercices compatibles
      let compatibles = allData.filter(e =>
        selectedInstruments.includes(e.instrument) &&
        selectedEpoques.includes(e.époque) &&
        selectedObjectifs.some(o => e.objectifs.split(",").map(x => x.trim()).includes(o))
      );

      // Mélanger les exercices compatibles
      compatibles = compatibles.sort(() => Math.random() - 0.5);

      // Découpage simple en 3 blocs égaux pour l’instant
      const blocCount = 3;
      const blocDuration = Math.floor(dureeTotale / blocCount);
      const session = [];

      if (includeSonsFiles) {
        session.push({ type: "sons-filés" });
      }

      for (let i = 0; i < blocCount && i < compatibles.length; i++) {
        const bloc = compatibles[i];
        session.push({
          type: "exercice",
          title: bloc.titre,
          duration: blocDuration,
          pdf: bloc.pdf
        });
      }

      // Nettoyage du type
      session.forEach(bloc => {
        bloc.type = bloc.type.trim().toLowerCase().replace(/\s+/g, "-");
      });

      // Stocker dans localStorage et rediriger
      localStorage.setItem("seance", JSON.stringify(session));
      window.location.href = "preview.html";
    });
  </script>
</body>
</html>
