
<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Générateur de séance technique</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 2rem; background-color: #f6f6f6; }
    h1, h2 { text-align: center; }
    form, .bloc { background: white; padding: 1rem; margin-bottom: 2rem; border-radius: 8px; box-shadow: 0 0 5px rgba(0,0,0,0.1); }
    label { display: block; margin: 0.5em 0; }
    button { padding: 0.5em 1em; font-size: 1em; margin-top: 1rem; }
  </style>
</head>
<body>
  <h1>Séance technique personnalisée</h1>
  <form id="formulaire">
    <h2>🎯 Objectifs techniques</h2>
    <label><input type="checkbox" name="objectif" value="spiccato"> Spiccato</label>
    <label><input type="checkbox" name="objectif" value="trille"> Trille</label>
    <label><input type="checkbox" name="objectif" value="agilité"> Agilité</label>
    <label><input type="checkbox" name="objectif" value="justesse"> Justesse</label>

    <h2>⏱ Durée totale</h2>
    <input type="number" id="duree" value="60" min="10" step="5"> minutes

    <br><button type="submit">Générer la séance</button>
  </form>

  <div id="resultat"></div>

  <script>
    const exercices = [
      { titre: "Sons filés cordes à vide", type: "sons_files", objectifs: ["justesse"], duree_min: 6, pdf: "sons_filles_1.pdf" },
      { titre: "Gammes en 3 octaves", type: "gammes_arpeges", objectifs: ["justesse"], duree_min: 6, pdf: "gammes_3oct.pdf" },
      { titre: "Feuillard n°32", type: "exercice", objectifs: ["spiccato", "agilité"], duree_min: 8, pdf: "feuillard_32.pdf" },
      { titre: "Trilles en doubles", type: "exercice", objectifs: ["trille"], duree_min: 7, pdf: "trilles_double.pdf" },
      { titre: "Popper n°6", type: "etude", objectifs: ["spiccato", "agilité"], duree_min: 14, pdf: "popper_6.pdf" },
      { titre: "Étude de Lee n°9", type: "etude", objectifs: ["justesse"], duree_min: 12, pdf: "lee_9.pdf" },
      { titre: "Sarabande de Bach", type: "repertoire", objectifs: ["justesse", "expressivité"], duree_min: 12, pdf: "bach_sarabande.pdf" },
      { titre: "Élégie de Fauré", type: "repertoire", objectifs: ["agilité", "expressivité"], duree_min: 15, pdf: "faure_elegie.pdf" }
    ];

    const repartition = {
      sons_files: 0.10,
      gammes_arpeges: 0.10,
      exercice: 0.30,
      etude: 0.30,
      repertoire: 0.20
    };

    document.getElementById("formulaire").addEventListener("submit", function(e) {
      e.preventDefault();
      const objectifs = Array.from(document.querySelectorAll('input[name="objectif"]:checked')).map(cb => cb.value);
      const dureeTotale = parseInt(document.getElementById("duree").value, 10);

      const seance = [];

      for (let type in repartition) {
        const dureeBloc = Math.round(dureeTotale * repartition[type]);
        const candidats = exercices.filter(ex => ex.type === type && objectifs.some(obj => ex.objectifs.includes(obj)));
        let bloc = [];
        let duree = 0;

        for (let ex of candidats) {
          if (duree + ex.duree_min <= dureeBloc) {
            bloc.push(ex);
            duree += ex.duree_min;
          }
        }

        bloc.forEach(ex => {
          seance.push({
            titre: ex.titre,
            pdf: ex.pdf,
            duree: ex.duree_min,
            pause: 1
          });
        });
      }

      localStorage.setItem("seance", JSON.stringify(seance));
      window.location.href = "lecture.html";
    });
  </script>
</body>
</html>
