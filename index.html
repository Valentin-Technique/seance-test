<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <title>Générateur de séance</title>
  <style>
    body {
      font-family: "IBM Plex Sans", sans-serif;
      padding: 2rem;
      background-color: #f7f7f7;
      color: #222;
    }
    h1 {
      font-size: 2rem;
      margin-bottom: 1rem;
    }
    label {
      display: block;
      margin: 0.5rem 0 0.2rem;
    }
    select, input[type="checkbox"] {
      margin-bottom: 1rem;
    }
    .btn {
      background-color: #222;
      color: white;
      padding: 0.6rem 1.2rem;
      border: none;
      border-radius: 0.4rem;
      cursor: pointer;
      font-size: 1rem;
      margin-top: 1rem;
    }
    .btn:hover {
      background-color: #444;
    }
  </style>
</head>
<body>
  <h1>Générer une séance de travail</h1>

  <form id="form">
    <label for="instrument">Instrument :</label>
    <select id="instrument" required></select>

    <label for="epoque">Époque :</label>
    <select id="epoque" required></select>

    <label for="objectifs">Objectifs :</label>
    <select id="objectifs" multiple required size="5"></select>

    <label for="duree">Durée de la séance :</label>
    <select id="duree" required>
      <option value="20">20 min</option>
      <option value="25">25 min</option>
      <option value="30">30 min</option>
      <option value="35">35 min</option>
      <option value="40">40 min</option>
      <option value="45">45 min</option>
      <option value="50">50 min</option>
      <option value="60" selected>60 min</option>
      <option value="90">90 min</option>
      <option value="120">120 min</option>
      <option value="180">180 min</option>
    </select>

    <br />
    <label><input type="checkbox" id="sonsFiles" /> Inclure sons filés en début de séance (10 min)</label>

    <br />
    <button type="submit" class="btn">Générer la séance</button>
  </form>

  <script>
    const API_URL = "https://script.google.com/macros/s/AKfycbzC5QT7l5KOLK31aabStx_lKwL9FW7lMqPYpvdSzxSAJohoDl1Zi1TI2ocT29GdOE-cLQ/exec";
    let base = [];

    fetch(API_URL)
      .then(res => res.json())
      .then(data => {
        base = data;

        const instruments = [...new Set(data.flatMap(e =>
          typeof e.instrument === "string" ? e.instrument.split(",").map(x => x.trim()) : []
        ))];
        const epoques = [...new Set(data.flatMap(e =>
          typeof e.epoque === "string" ? e.epoque.split(",").map(x => x.trim()) : []
        ))];
        const objectifs = [...new Set(data.flatMap(e =>
          typeof e.objectifs === "string" ? e.objectifs.split(",").map(x => x.trim()) : []
        ))];

        populateSelect("instrument", instruments);
        populateSelect("epoque", epoques);
        populateSelect("objectifs", objectifs);
      });

    function populateSelect(id, values) {
      const select = document.getElementById(id);
      values.sort().forEach(val => {
        const opt = document.createElement("option");
        opt.value = val;
        opt.textContent = val;
        select.appendChild(opt);
      });
    }

    function getSelectedValues(selectId) {
      const selected = [];
      const options = document.getElementById(selectId).options;
      for (const opt of options) {
        if (opt.selected) selected.push(opt.value);
      }
      return selected;
    }

    function shuffle(arr) {
      return arr.sort(() => Math.random() - 0.5);
    }

    document.getElementById("form").addEventListener("submit", e => {
      e.preventDefault();

      const instrument = document.getElementById("instrument").value;
      const epoque = document.getElementById("epoque").value;
      const objectifs = getSelectedValues("objectifs");
      const duree = parseInt(document.getElementById("duree").value, 10);
      const sonsFiles = document.getElementById("sonsFiles").checked;

      const filtered = base.filter(item => {
        const instrMatch = item.instrument?.includes(instrument);
        const epqMatch = item.epoque?.includes(epoque);
        const objMatch = objectifs.some(obj => item.objectifs?.includes(obj));
        return instrMatch && epqMatch && objMatch;
      });

      const getRandomItemByType = (type) => {
        const items = filtered.filter(e => e.type === type);
        return items.length ? shuffle(items)[0] : null;
      };

      const session = [];

      if (sonsFiles) {
        session.push({ type: "sons-filés", duree: 10 });
      }

      const repartition = [
        { type: "gammes", part: 0.1 },
        { type: "exercice", part: 0.3 },
        { type: "étude", part: 0.3 },
        { type: "répertoire", part: 0.3 },
      ];

      for (const section of repartition) {
        const bloc = getRandomItemByType(section.type);
        if (bloc) {
          session.push({
            ...bloc,
            duree: Math.round(duree * section.part),
          });
        }
      }

      // Insertion des pauses
      const finalSession = [];
      for (let i = 0; i < session.length; i++) {
        finalSession.push(session[i]);
        const isLast = i === session.length - 1;
        const isWorkBlock = session[i].type !== "sons-filés";
        const nextIsWorkBlock = session[i + 1] && session[i + 1].type !== "sons-filés";
        if (!isLast && isWorkBlock && nextIsWorkBlock) {
          finalSession.push({ type: "pause", duree: 2 });
        }
      }

      localStorage.setItem("seance", JSON.stringify(finalSession));
      window.location.href = "preview.html";
    });
  </script>
</body>
</html>
