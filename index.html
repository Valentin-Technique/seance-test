
<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Générateur de séance violoncelle</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 2rem; background-color: #f6f6f6; }
        h1, h2 { text-align: center; }
        form, .exercice { background: white; padding: 1rem; margin-bottom: 2rem; border-radius: 8px; box-shadow: 0 0 5px rgba(0,0,0,0.1); }
        label { display: block; margin: 0.5em 0; }
        iframe { width: 100%; height: 500px; border: 1px solid #ccc; margin-top: 1rem; }
        button { padding: 0.5em 1em; font-size: 1em; margin-top: 1rem; }
    </style>
</head>
<body>
    <h1>Générateur de séance technique</h1>
    <form id="formulaire">
        <h2>🎯 Choisis tes objectifs</h2>
        <label><input type="checkbox" name="objectif" value="spiccato"> Spiccato</label>
        <label><input type="checkbox" name="objectif" value="poignet"> Poignet</label>
        <label><input type="checkbox" name="objectif" value="trille"> Trille</label>
        <label><input type="checkbox" name="objectif" value="agilité"> Agilité</label>
        <label><input type="checkbox" name="objectif" value="staccato"> Staccato</label>
        <label><input type="checkbox" name="objectif" value="régularité"> Régularité</label>

        <h2>⏱ Durée souhaitée</h2>
        <input type="number" id="duree" value="30" min="5" step="5"> minutes

        <br><button type="submit">Générer la séance</button>
    </form>

    <div id="resultat"></div>

    <script>
        const exercices = [
            {
                titre: "Feuillard n°32",
                objectifs: ["spiccato", "poignet"],
                duree_min: 5,
                pdf: "feuillard_32.pdf"
            },
            {
                titre: "Popper n°6",
                objectifs: ["agilité", "staccato"],
                duree_min: 12,
                pdf: "popper_6.pdf"
            },
            {
                titre: "Trilles doubles",
                objectifs: ["trille", "régularité"],
                duree_min: 8,
                pdf: "trilles_double.pdf"
            }
        ];

        document.getElementById("formulaire").addEventListener("submit", function(e) {
            e.preventDefault();
            const objectifs = Array.from(document.querySelectorAll('input[name="objectif"]:checked')).map(cb => cb.value);
            const dureeMax = parseInt(document.getElementById("duree").value, 10);
            let dureeActuelle = 0;
            let selection = [];

            const candidats = exercices.filter(ex => objectifs.some(obj => ex.objectifs.includes(obj)));

            for (let ex of candidats) {
                if (dureeActuelle + ex.duree_min <= dureeMax) {
                    selection.push(ex);
                    dureeActuelle += ex.duree_min;
                }
            }

            const container = document.getElementById("resultat");
            container.innerHTML = "<h2>📋 Ta séance</h2>";

            if (selection.length === 0) {
                container.innerHTML += "<p>Aucun exercice trouvé avec ces critères.</p>";
                return;
            }

            for (let ex of selection) {
                container.innerHTML += `
                    <div class="exercice">
                        <h3>${ex.titre}</h3>
                        <p><strong>Objectifs :</strong> ${ex.objectifs.join(", ")}<br>
                        <strong>Durée estimée :</strong> ${ex.duree_min} min</p>
                        <iframe src="${ex.pdf}"></iframe>
                    </div>
                `;
            }
        });
    </script>
</body>
</html>
