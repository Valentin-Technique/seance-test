
<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Générateur de séance technique</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 2rem; background-color: #f0f0f0; }
    h1, h2 { text-align: center; }
    form, .bloc { background: white; padding: 1rem; margin-bottom: 2rem; border-radius: 8px; box-shadow: 0 0 5px rgba(0,0,0,0.1); }
    label { display: block; margin: 0.5em 0; }
    button { padding: 0.5em 1em; font-size: 1em; margin-top: 1rem; }
  </style>
</head>
<body>
  <h1>Séance technique personnalisée</h1>
  <form id="formulaire">
    <h2>🎯 Objectifs techniques</h2>
    <label><input type="checkbox" name="objectif" value="spiccato"> Spiccato</label>
    <label><input type="checkbox" name="objectif" value="trille"> Trille</label>
    <label><input type="checkbox" name="objectif" value="agilité"> Agilité</label>
    <label><input type="checkbox" name="objectif" value="justesse"> Justesse</label>

    <h2>⏱ Durée totale de la séance</h2>
    <input type="number" id="duree" value="60" min="10" step="5"> minutes

    <label style="margin-top:1em;">
      <input type="checkbox" id="sonsFiles"> Inclure sons filés en début de séance (10 min)
    </label>

    <br><button type="submit">Générer la séance</button>
  </form>

  <script>
    document.getElementById("formulaire").addEventListener("submit", function(e) {
      e.preventDefault();
      const objectifs = Array.from(document.querySelectorAll('input[name=objectif]:checked')).map(el => el.value);
      const dureeTotale = parseInt(document.getElementById("duree").value, 10);
      const inclureSonsFiles = document.getElementById("sonsFiles").checked;

      const config = {
        objectifs: objectifs,
        duree: dureeTotale,
        sons_files: inclureSonsFiles
      };

      localStorage.setItem("config", JSON.stringify(config));
      window.location.href = "preview.html";
    });
  </script>
</body>
</html>
