<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="apple-touch-icon" href="icone-192.png">
  <title>Générateur de séance</title>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: "IBM Plex Sans", sans-serif;
      padding: 2rem;
      background-color: #f7f7f7;
      color: #222;
    }

    h1 {
      font-size: 2rem;
      margin-bottom: 1.5rem;
    }

    .form-section {
      margin-bottom: 2rem;
    }

    .checkbox-group {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 0.5rem;
      margin-top: 0.5rem;
    }

    .checkbox-group label {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      background-color: #fff;
      border: 1px solid #ccc;
      border-radius: 6px;
      padding: 0.5rem 0.75rem;
      cursor: pointer;
      font-weight: normal;
      transition: background 0.2s ease;
    }

    .checkbox-group label:hover {
      background-color: #eee;
    }

    input[type="checkbox"],
    input[type="radio"] {
      transform: scale(1.2);
    }

    .btn {
      background-color: #222;
      color: white;
      padding: 0.8rem 1.5rem;
      border: none;
      border-radius: 0.5rem;
      cursor: pointer;
      font-size: 1rem;
      margin-top: 1rem;
      transition: background 0.2s ease;
    }

    .btn:hover {
      background-color: #444;
    }
  </style>
</head>
<body>
  <h1>Générer une séance de travail</h1>

<button class="btn" onclick="window.location.href='historique.html'">Historique des séances</button>
  <div style="margin-bottom: 1.5rem;"></div>
  
  <form id="form">
    <div class="form-section">
      <label>Instrument :</label>
      <div id="instrument-options" class="checkbox-group"></div>
    </div>

    <div class="form-section">
      <label>Époque :</label>
      <div id="epoque-options" class="checkbox-group"></div>
    </div>

    <div class="form-section">
      <label>Objectifs :</label>
      <div id="objectifs-options" class="checkbox-group"></div>
    </div>

    <div class="form-section">
      <label>Durée :</label>
      <div id="duree-options" class="checkbox-group">
        <label><input type="radio" name="duree" value="20"> 20 min</label>
        <label><input type="radio" name="duree" value="25"> 25 min</label>
        <label><input type="radio" name="duree" value="30"> 30 min</label>
        <label><input type="radio" name="duree" value="35"> 35 min</label>
        <label><input type="radio" name="duree" value="40"> 40 min</label>
        <label><input type="radio" name="duree" value="45"> 45 min</label>
        <label><input type="radio" name="duree" value="50"> 50 min</label>
        <label><input type="radio" name="duree" value="60" checked> 60 min</label>
        <label><input type="radio" name="duree" value="90"> 90 min</label>
        <label><input type="radio" name="duree" value="120"> 120 min</label>
        <label><input type="radio" name="duree" value="180"> 180 min</label>
      </div>
    </div>

    <div class="form-section">
      <label><input type="checkbox" id="sonsFiles" /> Inclure sons filés en début de séance (10 min)</label>
    </div>

    <button type="submit" class="btn">Générer la séance</button>
  </form>

  <script>
    const API_URL = "https://script.google.com/macros/s/AKfycbzC5QT7l5KOLK31aabStx_lKwL9FW7lMqPYpvdSzxSAJohoDl1Zi1TI2ocT29GdOE-cLQ/exec";
    let base = [];

    fetch(API_URL)
      .then(res => res.json())
      .then(data => {
        base = data;

        const instruments = [...new Set(data.flatMap(e =>
          typeof e.instrument === "string" ? e.instrument.split(",").map(x => x.trim()) : []
        ))];
        const epoques = [...new Set(data.flatMap(e =>
          typeof e.epoque === "string" ? e.epoque.split(",").map(x => x.trim()) : []
        ))];
        const objectifs = [...new Set(data.flatMap(e =>
          typeof e.objectifs === "string" ? e.objectifs.split(",").map(x => x.trim()) : []
        ))];

        populateRadio("instrument-options", "instrument", instruments);
        populateRadio("epoque-options", "epoque", epoques);
        populateCheckbox("objectifs-options", objectifs);
      });

    function populateRadio(containerId, name, values) {
      const container = document.getElementById(containerId);
      values.sort().forEach(val => {
        const label = document.createElement("label");
        label.innerHTML = `<input type="radio" name="${name}" value="${val}" required> ${val}`;
        container.appendChild(label);
      });
    }

    function populateCheckbox(containerId, values) {
      const container = document.getElementById(containerId);
      values.sort().forEach(val => {
        const label = document.createElement("label");
        label.innerHTML = `<input type="checkbox" name="objectifs" value="${val}"> ${val}`;
        container.appendChild(label);
      });
    }

    function shuffle(arr) {
      return arr.sort(() => Math.random() - 0.5);
    }

    document.getElementById("form").addEventListener("submit", e => {
      e.preventDefault();

      const instrument = document.querySelector('input[name="instrument"]:checked')?.value;
      const epoque = document.querySelector('input[name="epoque"]:checked')?.value;
      const objectifs = Array.from(document.querySelectorAll('input[name="objectifs"]:checked')).map(cb => cb.value);
      const duree = parseInt(document.querySelector('input[name="duree"]:checked')?.value || "60", 10);
      const sonsFiles = document.getElementById("sonsFiles").checked;

      if (!instrument || !epoque || objectifs.length === 0) {
        alert("Merci de sélectionner un instrument, une époque et au moins un objectif.");
        return;
      }

      const filtered = base.filter(item => {
        const instrMatch = item.instrument?.includes(instrument);
        const epqMatch = item.epoque?.includes(epoque);
        const objMatch = objectifs.some(obj => item.objectifs?.includes(obj));
        return instrMatch && epqMatch && objMatch;
      });

      const getRandomItemByType = (type) => {
        const items = filtered.filter(e => e.type === type);
        return items.length ? shuffle(items)[0] : null;
      };

      const session = [];

      if (sonsFiles) {
        session.push({ type: "sons-filés", duree: 10 });
      }

      const repartition = [
        { type: "gammes", part: 0.1 },
        { type: "exercice", part: 0.3 },
        { type: "étude", part: 0.3 },
        { type: "répertoire", part: 0.3 },
      ];

      for (const section of repartition) {
        const bloc = getRandomItemByType(section.type);
        if (bloc) {
          session.push({
            type: bloc.type,
            title: bloc.titre,
            pdf: bloc.pdf,
            duree: Math.round(duree * section.part),
            recueil: bloc.recueil || "",
            auteur: bloc.auteur || "",
            date: bloc.date || "",
            objectifs: bloc.objectifs || ""
          });
        }
      }

     const finalSession = [];

for (let i = 0; i < session.length; i++) {
  const current = session[i];
  const next = session[i + 1];
  finalSession.push(current);

  const isWorkBlock = current.type !== "sons-filés" && current.type !== "pause";
  const nextIsWorkBlock = next && next.type !== "sons-filés" && next.type !== "pause";

  if (isWorkBlock && nextIsWorkBlock) {
    finalSession.push({ type: "pause", duree: 2 });
  }
}

localStorage.setItem("seance", JSON.stringify(session));

const history = JSON.parse(localStorage.getItem("historiqueSeances") || "[]");
history.push({
  timestamp: new Date().toISOString(),
  session: session
});
localStorage.setItem("historiqueSeances", JSON.stringify(history));

window.location.href = "preview.html";
    });
  </script>
  <script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', function () {
      navigator.serviceWorker.register('/seance-test/service-worker.js')
        .catch(function (error) {
          console.error('Service Worker registration failed:', error);
        });
    });
  }
</script>

</body>
</html>
