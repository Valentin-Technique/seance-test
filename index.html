<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <title>Générateur de séance</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <style>
    body {
      font-family: "IBM Plex Sans", sans-serif;
      padding: 2rem;
      max-width: 800px;
      margin: auto;
    }
    h1 {
      font-size: 1.8rem;
    }
    label {
      display: block;
      margin-top: 1rem;
      font-weight: bold;
    }
    .checkbox-group, .objectifs-group {
      display: flex;
      flex-wrap: wrap;
      gap: 1rem;
    }
    .checkbox-group label, .objectifs-group label {
      font-weight: normal;
    }
    button {
      margin-top: 2rem;
      padding: 0.8rem 1.5rem;
      font-size: 1rem;
      border: none;
      background-color: #222;
      color: white;
      border-radius: 6px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <h1>Générateur de séance</h1>

  <label>Instrument :</label>
  <div class="checkbox-group">
    <label><input type="radio" name="instrument" value="violon" checked /> Violon</label>
    <label><input type="radio" name="instrument" value="violoncelle" /> Violoncelle</label>
  </div>

  <label>Époques :</label>
  <div class="checkbox-group">
    <label><input type="checkbox" name="epoque" value="XVIIIe" checked /> XVIIIe</label>
    <label><input type="checkbox" name="epoque" value="XIXe" checked /> XIXe</label>
    <label><input type="checkbox" name="epoque" value="XXe" checked /> XXe</label>
  </div>

  <label>Objectifs :</label>
  <div class="objectifs-group">
    <label><input type="checkbox" name="objectif" value="détaché" /> Détaché</label>
    <label><input type="checkbox" name="objectif" value="trilles" /> Trilles</label>
    <label><input type="checkbox" name="objectif" value="vitesse" /> Vitesse</label>
    <label><input type="checkbox" name="objectif" value="position" /> Changement de position</label>
    <!-- Ajoute d'autres objectifs ici -->
  </div>

  <label>Durée de la séance :</label>
  <select id="duree">
    <option value="20">20 min</option>
    <option value="30">30 min</option>
    <option value="45">45 min</option>
    <option value="60" selected>60 min</option>
    <option value="90">90 min</option>
  </select>

  <label><input type="checkbox" id="sons-files" /> Inclure les sons filés (10 min au début)</label>

  <button onclick="genererSeance()">Générer la séance</button>

  <script>
    const apiUrl = "https://script.google.com/macros/s/AKfycbzC5QT7l5KOLK31aabStx_lKwL9FW7lMqPYpvdSzxSAJohoDl1Zi1TI2ocT29GdOE-cLQ/exec";

    async function genererSeance() {
      const instrument = document.querySelector('input[name="instrument"]:checked').value;
      const epoques = [...document.querySelectorAll('input[name="epoque"]:checked')].map(e => e.value);
      const objectifs = [...document.querySelectorAll('input[name="objectif"]:checked')].map(o => o.value);
      const duree = parseInt(document.getElementById("duree").value);
      const inclureSonsFiles = document.getElementById("sons-files").checked;

      const res = await fetch(apiUrl);
      const data = await res.json();

      const selection = data.filter(item =>
        item.instrument === instrument &&
        epoques.includes(item.époque) &&
        objectifs.some(obj => item.objectifs.toLowerCase().includes(obj.toLowerCase()))
      );

      const tirage = selection.sort(() => Math.random() - 0.5).slice(0, 4); // à ajuster

      const session = [];

      if (inclureSonsFiles) session.push({ type: "sons-filés" });

      for (const bloc of tirage) {
        session.push({
          type: bloc.type,
          title: bloc.titre,
          pdf: bloc.pdf,
          duree: Math.round(duree / tirage.length),
        });
      }

      localStorage.setItem("seance", JSON.stringify(session));
      window.location.href = "preview.html";
    }
  </script>
</body>
</html>
