<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="apple-touch-icon" href="icone-192.png">
  <title>Aperçu de la séance – test</title>
  <style>
    body {
      font-family: "IBM Plex Sans", sans-serif;
      background-color: #f5f5f5;
      margin: 0;
      padding: 2rem;
      color: #222;
    }
    h1 {
      font-size: 2rem;
      margin-bottom: 1rem;
    }
    .header-buttons {
      display: flex;
      gap: 1rem;
      margin-bottom: 2rem;
    }
    .scroll-container {
      display: flex;
      flex-direction: row;
      overflow-x: auto;
      gap: 1.5rem;
      padding-bottom: 1rem;
    }
    .block {
      flex: 0 0 auto;
      width: 420px;
      background: white;
      border-radius: 1rem;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.05);
      padding: 1rem;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .block-title {
      font-weight: bold;
      font-size: 1.1rem;
      margin-bottom: 1rem;
      text-align: center;
    }
    .pdf-thumbnail {
      max-width: 100%;
      max-height: 450px;
      margin-bottom: 0.8rem;
    }
    .block-buttons {
      margin-bottom: 0.8rem;
    }
    button {
      font-family: inherit;
      background: #222;
      color: white;
      border: none;
      border-radius: 0.5rem;
      padding: 0.4rem 0.8rem;
      cursor: pointer;
    }
    button:hover {
      background: #444;
    }
    .block-info {
      font-size: 0.9rem;
      color: #555;
      text-align: center;
    }
    .pause-block {
      font-style: italic;
      color: #777;
      margin-top: 1rem;
    }
    .objectif-badge {
  display: inline-block;
  background-color: #eee;
  color: #333;
  padding: 0.2rem 0.5rem;
  border-radius: 0.5rem;
  font-size: 0.8rem;
  margin: 0.1rem;
}
  </style>
</head>
<body>
  <h1>Aperçu de la séance</h1>
  <div class="header-buttons">
    <button onclick="window.location.href='index.html'">Revenir à l’éditeur</button>
    <button onclick="window.location.href='lecture.html'">Démarrer la séance</button>
  </div>

  <div class="scroll-container" id="previewContainer"></div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.4.120/pdf.min.js"></script>
  <script>
    pdfjsLib.GlobalWorkerOptions.workerSrc = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.4.120/pdf.worker.min.js";
  </script>

  <script>
    const container = document.getElementById("previewContainer");

    const rawSession = JSON.parse(localStorage.getItem("seance") || "[]");
const sessionWithPauses = [];

for (let i = 0; i < rawSession.length; i++) {
  const current = rawSession[i];
  const next = rawSession[i + 1];
  sessionWithPauses.push(current);

  const isWorkBlock = current.type !== "sons-filés" && current.type !== "pause";
  const nextIsWorkBlock = next && next.type !== "sons-filés" && next.type !== "pause";

  if (isWorkBlock && nextIsWorkBlock) {
    sessionWithPauses.push({ type: "pause", duree: 2 });
  }
}


    function createBlockElement(block) {
      const div = document.createElement("div");
      div.className = "block";

const typeLabel = document.createElement("div");
typeLabel.className = "block-title";
typeLabel.textContent = block.type === "pause"
  ? "Pause"
  : block.type === "sons-filés"
  ? "Sons filés"
  : block.type.charAt(0).toUpperCase() + block.type.slice(1);
div.appendChild(typeLabel);

if (block.titre && block.type !== "pause" && block.type !== "sons-filés") {
  const mainTitle = document.createElement("div");
  mainTitle.style.fontWeight = "bold";
  mainTitle.style.fontSize = "1.2rem";
  mainTitle.style.marginBottom = "0.4rem";
  mainTitle.style.textAlign = "center";
  mainTitle.textContent = block.titre;
  div.appendChild(mainTitle);
}


      if (block.type === "pause") {
        const pauseText = document.createElement("div");
        pauseText.className = "pause-block";
        pauseText.textContent = "2 min – Temps de repos";
        div.appendChild(pauseText);
        return div;
      }

      if (block.type === "sons-filés") {
        const info = document.createElement("div");
        info.className = "block-info";
        info.textContent = "Durée : 10 min";
        div.appendChild(info);
        return div;
      }

      if (block.pdf) {
        const canvas = document.createElement("canvas");
        canvas.className = "pdf-thumbnail";
        div.appendChild(canvas);

        const loadingTask = pdfjsLib.getDocument(block.pdf);
        loadingTask.promise.then(pdf => {
          pdf.getPage(1).then(page => {
            const scale = 0.75;
            const viewport = page.getViewport({ scale });
            canvas.height = viewport.height;
            canvas.width = viewport.width;

            const renderContext = {
              canvasContext: canvas.getContext("2d"),
              viewport: viewport
            };
            page.render(renderContext);
          });
        });
      }

      const buttons = document.createElement("div");
      buttons.className = "block-buttons";
      const shuffleBtn = document.createElement("button");
      shuffleBtn.textContent = "Changer d’exercice";
      shuffleBtn.onclick = () => location.reload(); // temporaire
      buttons.appendChild(shuffleBtn);
      div.appendChild(buttons);

     const info = document.createElement("div");
info.className = "block-info";

let html = "";

if (block.auteur) html += `${block.auteur}<br>`;
if (block.recueil) html += `${block.recueil}<br>`;
if (block.date) html += `${block.date}<br><br>`; // saut de ligne avant objectifs

if (block.objectifs) {
  const objectifs = block.objectifs.split(",").map(o => o.trim());
  html += objectifs.map(o => `<span class="objectif-badge">${o}</span>`).join(" ");
  html += "<br><br>";
}

html += `Durée : ${block.duree || block.duration || "?"} min`;

info.innerHTML = html;
div.appendChild(info);


      return div;
    }

    // Nettoyage des types et suppression du doublon "sons-filés"
    const cleanedSession = [];
    let seenSonsFiles = false;

    sessionWithPauses.forEach(block => {
      // Nettoyage du type
      block.type = block.type.trim().toLowerCase().replace(/\s+/g, "-");

      // Élimination des doublons "sons-filés"
      if (block.type === "sons-filés") {
        if (seenSonsFiles) return;
        seenSonsFiles = true;
      }

      cleanedSession.push(block);
    });

    // Affichage
    cleanedSession.forEach(block => {
      container.appendChild(createBlockElement(block));
    });
  </script>
    <script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', function () {
      navigator.serviceWorker.register('/seance-test/service-worker.js')
        .catch(function (error) {
          console.error('Service Worker registration failed:', error);
        });
    });
  }
</script>
</body>
</html>
