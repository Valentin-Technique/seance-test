<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Aperçu de la séance – test</title>
  <style>
    body {
      font-family: "IBM Plex Sans", sans-serif;
      background-color: #f5f5f5;
      margin: 0;
      padding: 2rem;
      color: #222;
    }
    h1 {
      font-size: 2rem;
      margin-bottom: 1rem;
    }
    .header-buttons {
      display: flex;
      gap: 1rem;
      margin-bottom: 2rem;
    }
    .scroll-container {
      display: flex;
      flex-direction: row;
      overflow-x: auto;
      gap: 1.5rem;
      padding-bottom: 1rem;
    }
    .block {
      flex: 0 0 auto;
      width: 420px;
      background: white;
      border-radius: 1rem;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.05);
      padding: 1rem;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .block-title {
      font-weight: bold;
      font-size: 1.1rem;
      margin-bottom: 1rem;
      text-align: center;
    }
    .pdf-thumbnail {
      max-width: 100%;
      max-height: 450px;
      margin-bottom: 0.8rem;
    }
    .block-buttons {
      margin-bottom: 0.8rem;
    }
    button {
      font-family: inherit;
      background: #222;
      color: white;
      border: none;
      border-radius: 0.5rem;
      padding: 0.4rem 0.8rem;
      cursor: pointer;
    }
    button:hover {
      background: #444;
    }
    .block-info {
      font-size: 0.9rem;
      color: #555;
      text-align: center;
    }
    .pause-block {
      font-style: italic;
      color: #777;
      margin-top: 1rem;
    }
  </style>
</head>
<body>
  <h1>Aperçu de la séance</h1>
  <div class="header-buttons">
    <button onclick="window.location.href='index.html'">Revenir à l’éditeur</button>
    <button onclick="window.location.href='lecture.html'">Démarrer la séance</button>
  </div>

  <div class="scroll-container" id="previewContainer"></div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.4.120/pdf.min.js"></script>
  <script>
    pdfjsLib.GlobalWorkerOptions.workerSrc = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.4.120/pdf.worker.min.js";
  </script>

  <script>
    const container = document.getElementById("previewContainer");

    let baseSession = [];
try {
  baseSession = JSON.parse(localStorage.getItem("seance")) || [];
} catch (e) {
  console.error("Erreur de chargement de la séance :", e);
}

    const sessionWithPauses = [];
    baseSession.forEach((block, i) => {
      sessionWithPauses.push(block);
      const isLast = i === baseSession.length - 1;
      const isWorkBlock = block.type !== "sons-filés";
      const nextBlockIsWork = baseSession[i + 1] && baseSession[i + 1].type !== "sons-filés";
      if (!isLast && isWorkBlock && nextBlockIsWork) {
        sessionWithPauses.push({ type: "pause" });
      }
    });

    function createBlockElement(block) {
      const div = document.createElement("div");
      div.className = "block";

      const title = document.createElement("div");
      title.className = "block-title";
      title.textContent = block.type === "pause"
        ? "Pause"
        : block.type === "sons-filés"
        ? "Sons filés"
        : block.title;

      div.appendChild(title);

      if (block.type === "pause") {
        const pauseText = document.createElement("div");
        pauseText.className = "pause-block";
        pauseText.textContent = "2 min – Temps de repos";
        div.appendChild(pauseText);
        return div;
      }

      if (block.type === "sons-filés") {
        const info = document.createElement("div");
        info.className = "block-info";
        info.textContent = "Durée : 10 min";
        div.appendChild(info);
        return div;
      }

      if (block.pdf) {
        const canvas = document.createElement("canvas");
        canvas.className = "pdf-thumbnail";
        div.appendChild(canvas);

        const loadingTask = pdfjsLib.getDocument(block.pdf);
        loadingTask.promise.then(pdf => {
          pdf.getPage(1).then(page => {
            const scale = 0.75;
            const viewport = page.getViewport({ scale });
            canvas.height = viewport.height;
            canvas.width = viewport.width;

            const renderContext = {
              canvasContext: canvas.getContext("2d"),
              viewport: viewport
            };
            page.render(renderContext);
          });
        });
      }

      const buttons = document.createElement("div");
      buttons.className = "block-buttons";
      const shuffleBtn = document.createElement("button");
      shuffleBtn.textContent = "Changer d’exercice";
      shuffleBtn.onclick = () => location.reload(); // temporaire
      buttons.appendChild(shuffleBtn);
      div.appendChild(buttons);

      const info = document.createElement("div");
      info.className = "block-info";
      info.innerHTML = `${block.title}<br>Durée : ${block.duration} min`;
      div.appendChild(info);

      return div;
    }

    // Nettoyage des types et suppression du doublon "sons-filés"
    const cleanedSession = [];
    let seenSonsFiles = false;

    sessionWithPauses.forEach(block => {
      // Nettoyage du type
      block.type = block.type.trim().toLowerCase().replace(/\s+/g, "-");

      // Élimination des doublons "sons-filés"
      if (block.type === "sons-filés") {
        if (seenSonsFiles) return;
        seenSonsFiles = true;
      }

      cleanedSession.push(block);
    });

    // Affichage
    cleanedSession.forEach(block => {
      container.appendChild(createBlockElement(block));
    });

    // Enregistrement dans localStorage
    localStorage.setItem("seance", JSON.stringify(cleanedSession));
  </script>
</body>
</html>
