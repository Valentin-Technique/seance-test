<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Aperçu de la séance</title>
  <link rel="stylesheet" href="style.css" />
  <style>
    body {
      font-family: "IBM Plex Sans", sans-serif;
      background-color: #f5f5f5;
      margin: 0;
      padding: 2rem;
      color: #222;
    }
    h1 {
      font-size: 2rem;
      margin-bottom: 1rem;
    }
    .block {
      background: white;
      border-radius: 1rem;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.05);
      padding: 1rem 1.5rem;
      margin-bottom: 1.5rem;
    }
    .block-title {
      font-weight: bold;
      font-size: 1.2rem;
      margin-bottom: 0.5rem;
    }
    .block-duration {
      font-size: 0.9rem;
      color: #555;
      margin-bottom: 0.5rem;
    }
    .pdf-thumbnail {
      max-width: 100px;
      display: block;
      margin-bottom: 0.5rem;
    }
    .block-buttons {
      margin-top: 0.5rem;
    }
    button {
      font-family: inherit;
      background: #222;
      color: white;
      border: none;
      border-radius: 0.5rem;
      padding: 0.4rem 0.8rem;
      cursor: pointer;
    }
    button:hover {
      background: #444;
    }
    .pause-block {
      font-style: italic;
      color: #777;
    }
  </style>
</head>
<body>
  <h1>Aperçu de la séance générée</h1>
  <div id="previewContainer"></div>

  <!-- Import PDF.js -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.4.120/pdf.min.js"></script>
  <script>
    pdfjsLib.GlobalWorkerOptions.workerSrc = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.4.120/pdf.worker.min.js";
  </script>

  <script>
    const sessionData = JSON.parse(localStorage.getItem("generatedSession")) || [];
    const includeSonsFiles = localStorage.getItem("includeSonsFiles") === "true";
    const container = document.getElementById("previewContainer");

    function createBlockElement(block, index) {
      const div = document.createElement("div");
      div.className = "block";

      const title = document.createElement("div");
      title.className = "block-title";

      const duration = document.createElement("div");
      duration.className = "block-duration";

      title.textContent = block.type === "pause" ? "Pause" :
                          block.type === "sons-filés" ? "Sons filés" :
                          block.title;

      duration.textContent = block.type === "pause"
        ? "Durée : 2 min"
        : block.type === "sons-filés"
        ? "Durée : 10 min"
        : `Durée : ${block.duration} min`;

      div.appendChild(title);
      div.appendChild(duration);

      if (block.type === "pause") {
        const pauseText = document.createElement("div");
        pauseText.className = "pause-block";
        pauseText.textContent = "Temps de repos";
        div.appendChild(pauseText);
        return div;
      }

      if (block.type === "sons-filés") {
        return div; // bloc spécial : pas de PDF ni bouton
      }

      // Miniature PDF
      const canvas = document.createElement("canvas");
      canvas.className = "pdf-thumbnail";
      div.appendChild(canvas);

      const loadingTask = pdfjsLib.getDocument(block.pdf);
      loadingTask.promise.then(pdf => {
        pdf.getPage(1).then(page => {
          const scale = 0.3;
          const viewport = page.getViewport({ scale });
          canvas.height = viewport.height;
          canvas.width = viewport.width;

          const renderContext = {
            canvasContext: canvas.getContext("2d"),
            viewport: viewport
          };
          page.render(renderContext);
        });
      });

      const buttons = document.createElement("div");
      buttons.className = "block-buttons";

      const shuffleBtn = document.createElement("button");
      shuffleBtn.textContent = "Changer d’exercice";
      shuffleBtn.onclick = () => {
        // Recharge la page pour une nouvelle sélection aléatoire
        location.reload();
      };
      buttons.appendChild(shuffleBtn);
      div.appendChild(buttons);

      return div;
    }

    if (includeSonsFiles) {
      const sonsF = {
        type: "sons-filés"
      };
      container.appendChild(createBlockElement(sonsF));
    }

    sessionData.forEach((block, i) => {
      container.appendChild(createBlockElement(block, i));
    });
  </script>
</body>
</html>
